<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>截图与录屏设置</title><link rel="stylesheet" href="settings.css"><body><main><section><h2>保存位置</h2><div class="path-row"><input id="folder" aria-label="保存位置" readonly><button id="browse">更改</button></div><p>图片和视频保存在同一文件夹。</p></section><section><h2>录屏</h2><div class="row"><label for="resolution">分辨率上限</label><select id="resolution"><option value="720">720p</option><option value="1080">1080p</option><option value="1440">1440p</option><option value="2160">2160p（4K）</option></select></div><div class="row"><label for="quality">画质</label><select id="quality"><option value="low">Low · 低</option><option value="medium">Medium · 中</option><option value="high">High · 高</option><option value="ultra">Ultra · 极高</option><option value="custom">自定义</option></select></div><div id="custom" hidden><div class="row"><label for="mbps">视频码率</label><div class="number"><input id="mbps" type="number" step="0.25"><span>Mbps</span></div></div><input id="bitrate-range" type="range" step="0.25" aria-label="调整视频码率"></div><p id="bitrate-label"></p><p>60 FPS · H.264 硬件编码。修改在下次录屏时生效。</p></section><section><h2>截图</h2><div class="row"><label for="screenshot">保存格式</label><select id="screenshot"><option value="compressed">压缩图 · JPEG</option><option value="original">原图 · PNG</option><option value="both">同时保存 JPEG 和 PNG</option></select></div></section><section><h2>快捷键</h2><div class="row"><label>开始 / 结束录屏</label><button id="record_key" class="key"></button></div><div class="row"><label>截图</label><button id="screenshot_key" class="key"></button></div><p id="key-help">点击修改，Backspace 取消。Xbox 分享键也可截图。</p></section></main><p id="feedback" role="status" hidden></p><script type="module" src="settings.js"></script></body></html>
