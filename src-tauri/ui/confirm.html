<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>退出确认</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:14px "Segoe UI","Microsoft YaHei",sans-serif;background:transparent;color:#edf1f7}body{display:grid;place-items:center;padding:24px;background:rgba(3,8,16,.66)}main{width:min(420px,100%);min-height:226px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:40px 28px;border:1px solid #9eafc53d;border-radius:14px;background:linear-gradient(145deg,#263345,#17212f 80%);box-shadow:0 24px 80px #0009,0 6px 20px #0005,inset 0 1px #ffffff0c}h1{font-size:18px;line-height:1.5;font-weight:500;margin:0;text-align:center;letter-spacing:.4px}footer{display:flex;justify-content:center;gap:14px;width:100%}button{width:144px;max-width:calc(50% - 7px);height:42px;padding:0;border-radius:7px;border:1px solid #ffffff24;cursor:pointer;font:inherit;transition:background .15s,box-shadow .15s}button:focus-visible{outline:2px solid #b3c4dd;outline-offset:4px}#cancel{background:#e8edf4;color:#202b3b;border-color:#e8edf4;box-shadow:0 2px 6px #0002}#cancel:hover{background:#fff}#exit{background:#101925;color:#edf1f7}#exit:hover{background:#29374a}@media(prefers-reduced-motion:reduce){button{transition:none}}
</style><main role="alertdialog" aria-modal="true" aria-labelledby="heading"><h1 id="heading">是否确认退出游戏？</h1><footer><button id="cancel" autofocus>继续游戏</button><button id="exit">退出游戏</button></footer></main><script type="module" src="confirm.js"></script></html>
